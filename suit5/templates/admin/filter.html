{% load i18n %}
{% block filter_select %}
<select aria-label="{{ title|capfirst }}" data-name="{{ field_name }}" class="auto-width search-filter{% if spec.lookup_val or spec.used_parameters %} active{% endif %}">
  {% block filter_options %}
  {% for choice in choices %}
    {% if forloop.first %}
      {% block filter_option_default %}
      <option value="">{% trans 'All' %}</option>
      {% endblock %}
    {% else %}
      {% block filter_option %}
      <option{% if choice.additional %} data-additional="{{ choice.additional }}"{% endif %} data-name="{{ choice.name }}" value="{{ choice.val }}" {{ choice.selected|yesno:' selected="selected",' }}>{{ choice.display }}</option>
      {% endblock %}
    {% endif %}
  {% endfor %}
  {% endblock %}
</select>
{% endblock %}
